name: Build binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Add Rust target
        run: rustup target add --toolchain stable "$TARGET"

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: binaries
          key: ${{ matrix.target }}

      - name: Build locked release binary
        run: cargo build --release --locked --bin sqln --target "$TARGET"

      - name: Check binary entry points
        shell: bash
        run: |
          "target/$TARGET/release/sqln" --version
          "target/$TARGET/release/sqln" --help

      - name: Package binary, licenses, and build information
        shell: bash
        run: |
          binary="target/$TARGET/release/sqln"
          version="$("$binary" --version | awk '{print $2}')"
          package="sqln-$version-$TARGET"
          mkdir -p "dist/$package"
          cp "$binary" README.md LICENSE-MIT LICENSE-APACHE "dist/$package/"
          {
            printf 'Version: %s\nCommit: %s\nTarget: %s\n' "$version" "$GITHUB_SHA" "$TARGET"
            rustc --version
          } > "dist/$package/BUILD-INFO.txt"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          cd dist
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqln-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binary archives and checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sqln-*
          merge-multiple: true
          path: dist

      - name: Verify archive checksums
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
