name: Build binaries

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Build locked release binary
        run: cargo build --release --locked --bin sqln --target "$TARGET"

      - name: Check binary entry points
        shell: bash
        run: |
          "target/$TARGET/release/sqln" --version
          "target/$TARGET/release/sqln" --help

      - name: Package binary, licenses, and build information
        shell: bash
        run: |
          binary="target/$TARGET/release/sqln"
          version="$("$binary" --version | awk '{print $2}')"
          package="sqln-$version-$TARGET"
          mkdir -p "dist/$package"
          cp "$binary" README.md LICENSE-MIT LICENSE-APACHE "dist/$package/"
          {
            printf 'Version: %s\nCommit: %s\nTarget: %s\n' "$version" "$GITHUB_SHA" "$TARGET"
            rustc --version
          } > "dist/$package/BUILD-INFO.txt"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          cd dist
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqln-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
