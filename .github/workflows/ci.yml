name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sccache caches the Rust and C compiler outputs in the GitHub Actions cache. The cc
  # crate follows RUSTC_WRAPPER for DuckDB; CMake follows the launcher variables for
  # librdkafka. sccache needs CARGO_INCREMENTAL=0.
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: '0'
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust components
        run: rustup component add --toolchain stable rustfmt clippy

      # librdkafka 2.12.1 includes curl/curl.h even when curl support is off.
      - name: Install libcurl headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci

      # rust-cache deletes the files in target/duckdb-sources, including the
      # completion marker. Remove the partial tree so libduckdb-sys unpacks it again.
      - name: Remove partial DuckDB sources
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources

      - name: Run delivery checks
        run: make check

      # Each driver is a Cargo feature. Build without drivers and with each one alone.
      - name: Check driver features
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p sqln-connector --no-default-features --quiet
          cargo check -p sqln --lib --bin sqln --no-default-features --quiet
          for feature in postgres mysql sqlite duckdb redis kafka databricks; do
            cargo check -p sqln --lib --bin sqln --no-default-features --features "$feature" --quiet
          done

  integration:
    name: Database integration and TLS (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # librdkafka 2.12.1 includes curl/curl.h even when curl support is off.
      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci

      # rust-cache deletes the files in target/duckdb-sources, including the
      # completion marker. Remove the partial tree so libduckdb-sys unpacks it again.
      - name: Remove partial DuckDB sources
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources

      - name: Create disposable TLS certificates
        run: scripts/test-certs.sh

      - name: Start test databases and TLS endpoints
        run: docker compose -f compose.test.yaml --profile tls up -d --wait --wait-timeout 180

      - name: Run database integration tests
        shell: bash
        run: |
          . scripts/test-env.sh
          export SQLN_TEST_TLS=1
          cargo test --locked --test sqln -- servers:: auth:: refused:: redis::

      - name: Show database logs on failure
        if: failure()
        run: docker compose -f compose.test.yaml --profile tls logs --no-color --tail 200

      - name: Stop test databases
        if: always()
        run: docker compose -f compose.test.yaml --profile tls down --volumes --remove-orphans
