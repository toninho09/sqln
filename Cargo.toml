[package]
name = "sqln"
version = "0.3.0"
edition = "2024"
description = "Terminal database client with several SQL consoles"
license = "MIT OR Apache-2.0"
exclude = ["spikes/", "scripts/", "compose.test.yaml"]
autotests = false

[dependencies]
arboard = { version = "3.7.0", default-features = false }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
duckdb = { version = "1.20000.1", default-features = false, features = ["bundled"] }
edtui = { version = "0.11.7", default-features = false, features = ["mouse-support"] }
futures-util = "0.3"
keyring-core = "1.0.1"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
similar = "3.2"
sqlparser = { version = "0.63", features = ["visitor"] }
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
socket2 = "0.6"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
rustix = { version = "1", default-features = false, features = ["std", "event", "process", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", default-features = false }
zbus = { version = "5", default-features = false }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "pty", "termios"] }

[[test]]
name = "ai"
path = "tests/ai.rs"

[[test]]
name = "app"
path = "tests/app.rs"

[[test]]
name = "auto_refresh"
path = "tests/auto_refresh.rs"

[[test]]
name = "diagram"
path = "tests/diagram.rs"

[[test]]
name = "duckdb"
path = "tests/duckdb.rs"

[[test]]
name = "editing"
path = "tests/editing.rs"

[[test]]
name = "exec"
path = "tests/exec.rs"

[[test]]
name = "grid"
path = "tests/grid.rs"

[[test]]
name = "settings"
path = "tests/settings.rs"

[[test]]
name = "sql"
path = "tests/sql.rs"

[[test]]
name = "store"
path = "tests/store.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"

# Targets that scripts, CI, or documents refer to by name; they stay alone.
[[test]]
name = "auth"
path = "tests/auth.rs"

[[test]]
name = "credentials"
path = "tests/credentials.rs"

[[test]]
name = "latency"
path = "tests/latency.rs"

[[test]]
name = "redis"
path = "tests/redis.rs"

[[test]]
name = "refused"
path = "tests/refused.rs"

[[test]]
name = "servers"
path = "tests/servers.rs"

[[test]]
name = "table"
path = "tests/table.rs"

[[test]]
name = "terminal"
path = "tests/terminal.rs"

[[test]]
name = "vault_probe"
path = "tests/vault_probe.rs"

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "memory"
harness = false

[profile.test]
debug = 0
