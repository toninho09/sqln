[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
sqln-core = { path = "crates/core" }
sqln-sql = { path = "crates/sql" }
sqln-session = { path = "crates/session" }
sqln-vault = { path = "crates/vault" }
sqln-postgres = { path = "crates/postgres" }
sqln-mysql = { path = "crates/mysql" }
sqln-sqlite = { path = "crates/sqlite" }
sqln-duckdb = { path = "crates/duckdb" }
sqln-redis = { path = "crates/redis" }
sqln-kafka = { path = "crates/kafka" }
sqln-databricks = { path = "crates/databricks" }
sqln-connector = { path = "crates/connector" }
sqln-store = { path = "crates/store" }
sqln-exec = { path = "crates/exec" }
sqln-runtime = { path = "crates/runtime" }
sqln-ui = { path = "crates/ui" }
sqln-testkit = { path = "crates/testkit" }
apache-avro = { version = "0.22", default-features = false }
arrow-array = { version = "60.1.0", default-features = false }
arrow-cast = { version = "60.1.0", default-features = false }
arrow-ipc = { version = "60.1.0", default-features = false }
arrow-schema = { version = "60.1.0", default-features = false }
arboard = { version = "3.7.0", default-features = false }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
duckdb = { version = "1.20000.1", default-features = false, features = ["bundled"] }
edtui = { version = "0.11.7", default-features = false, features = ["mouse-support"] }
futures-util = "0.3"
keyring-core = "1.0.1"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
proptest = { version = "1.7", default-features = false, features = ["std"] }
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build", "ssl-vendored", "libz-static", "zstd"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
similar = "3.2"
sqlparser = { version = "0.64", features = ["visitor"] }
base64 = "0.23"
rusqlite = { version = "0.42", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
socket2 = "0.6"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zeroize = { version = "1.9", features = ["derive"] }
signal-hook = "0.3"
rustix = { version = "1", default-features = false, features = ["std", "event", "process", "fs"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
secret-service = { version = "5.2", default-features = false }
# Match the zbus types exposed by secret-service and the keyring store.
zbus = { version = "5", default-features = false }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[package]
name = "sqln"
version.workspace = true
edition.workspace = true
description = "Terminal database client with several SQL consoles"
license.workspace = true
exclude = ["spikes/", "scripts/", "book/", "compose.test.yaml"]
autotests = false

[[bin]]
name = "sqln"
path = "src/main.rs"
# main.rs has no unit tests. The tests in tests/ run this binary.
test = false

[dependencies]
sqln-core.workspace = true
sqln-sql.workspace = true
sqln-connector = { workspace = true, default-features = false }
sqln-store.workspace = true
sqln-exec.workspace = true
sqln-runtime.workspace = true
sqln-ui.workspace = true
base64.workspace = true
crossterm.workspace = true
edtui.workspace = true
ratatui.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-width.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[features]
# Each feature adds one database driver. `cargo build --no-default-features --features
# postgres,sqlite` builds a smaller binary. The tests and benches need the default set,
# because they use the driver libraries directly.
default = ["postgres", "mysql", "sqlite", "duckdb", "redis", "kafka", "databricks"]
postgres = ["sqln-connector/postgres"]
mysql = ["sqln-connector/mysql"]
sqlite = ["sqln-connector/sqlite"]
duckdb = ["sqln-connector/duckdb"]
redis = ["sqln-connector/redis"]
kafka = ["sqln-connector/kafka"]
databricks = ["sqln-connector/databricks"]

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
rustix.workspace = true

[dev-dependencies]
sqln-store = { workspace = true, features = ["test-support"] }
sqln-testkit = { workspace = true, features = ["mock", "editor", "http"] }
async-trait.workspace = true
duckdb.workspace = true
futures-util.workspace = true
keyring-core.workspace = true
rdkafka.workspace = true
redis.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "pty", "termios"] }

[[test]]
name = "sqln"
path = "tests/sqln.rs"

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "memory"
harness = false

# Tests inherit this profile. Keep debug assertions and incremental compilation enabled.
[profile.dev]
opt-level = 1
debug = 0
