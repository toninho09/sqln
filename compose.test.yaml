# Disposable test databases. Data stays in memory, and ports use 127.0.0.1 only.
# Start:      docker compose -f compose.test.yaml up -d --wait
# With TLS:   scripts/test-certs.sh && docker compose -f compose.test.yaml --profile tls up -d --wait
# Stop:       docker compose -f compose.test.yaml --profile tls down

name: sqln-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d spike"]
      interval: 1s
      timeout: 3s
      retries: 90

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: spike
      MYSQL_DATABASE: spike
    ports:
      - "127.0.0.1:33069:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -pspike -e 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 120

  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "spike", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a spike --no-auth-warning ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis-open:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63801:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--requirepass", "spike", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63800:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a spike --no-auth-warning ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Kafka in KRaft mode. 19092 has no authentication; 19094 needs SASL PLAIN.
  # The registry and the broker talk on the internal listener.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,HOST://:19092,SASL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:19092,SASL://127.0.0.1:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT,SASL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="spike" password="spike" user_spike="spike";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19094:19094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 3s
      timeout: 20s
      retries: 60

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8081/subjects"]
      interval: 2s
      timeout: 5s
      retries: 90

  postgres-tls:
    profiles: [tls]
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./.test-certs:/certs-src:ro
      - ./scripts/test-db/pg-tls-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    entrypoint:
      - bash
      - -c
      - >-
        mkdir -p /certs && cp /certs-src/* /certs/ && chown -R postgres /certs &&
        chmod 600 /certs/server.key && exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
        -c ssl_ca_file=/certs/ca.crt -c hba_file=/certs/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d spike"]
      interval: 1s
      timeout: 3s
      retries: 90

  redis-tls:
    profiles: [tls]
    image: redis:8
    command:
      - redis-server
      - --requirepass
      - spike
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - optional
    ports:
      - "127.0.0.1:63802:6379"
    volumes:
      - ./.test-certs:/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --tls --cacert /certs/ca.crt -h localhost -a spike --no-auth-warning ping |
          grep -q PONG
      interval: 1s
      timeout: 3s
      retries: 30

  mysql-tls:
    profiles: [tls]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: spike
      MYSQL_DATABASE: spike
    ports:
      - "127.0.0.1:33070:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./.test-certs:/certs:ro
      - ./scripts/test-db/mysql-tls-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -pspike -e 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 120
