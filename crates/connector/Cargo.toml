[package]
name = "sqln-connector"
description = "All connectors of SQLN: the contract and the driver crates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
sqln-session.workspace = true
sqln-sql.workspace = true
sqln-store.workspace = true
sqln-vault.workspace = true
sqln-postgres = { workspace = true, optional = true }
sqln-mysql = { workspace = true, optional = true }
sqln-sqlite = { workspace = true, optional = true }
sqln-duckdb = { workspace = true, optional = true }
sqln-redis = { workspace = true, optional = true }
sqln-kafka = { workspace = true, optional = true }
sqln-databricks = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
# Each feature adds one driver. A build without a driver keeps its saved connections, and
# connecting to one explains that the build lacks the driver.
default = ["postgres", "mysql", "sqlite", "duckdb", "redis", "kafka", "databricks"]
postgres = ["dep:sqln-postgres"]
mysql = ["dep:sqln-mysql"]
sqlite = ["dep:sqln-sqlite"]
duckdb = ["dep:sqln-duckdb"]
redis = ["dep:sqln-redis"]
kafka = ["dep:sqln-kafka"]
databricks = ["dep:sqln-databricks"]

[lints]
workspace = true
